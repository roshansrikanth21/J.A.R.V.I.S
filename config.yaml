system:
  name: "JARVIS"
  wake_word: "jarvis" # Built-in keyword (no .ppn file needed)
  picovoice_key: "YOUR_PICOVOICE_ACCESS_KEY" # Get from console.picovoice.ai

voice:
  stt_model: "base" # "base" is good for speed/memory on RTX 3050, "large-v3" is best accuracy
  stt_device: "cpu" # Changed to CPU temporarily to avoid cublas64_12.dll error
  stt_compute_type: "int8" # Essential for 4GB VRAM
  tts_model_path: "en_US-lessac-high.onnx" # Path to Piper TTS model
  input_device_index: null # Set a numeric device index to force a specific mic
  enable_clap_wake: true # Allow clap pattern to trigger wake
  enable_keyword_wake: true # Allow Picovoice wake-word trigger
  clap_threshold: 12000 # Increase if false triggers, decrease if clap not detected
  clap_count_required: 2 # Double-clap default
  clap_window_s: 1.2 # Time window for required clap count
  clap_cooldown_s: 0.25 # Minimum gap between clap hits

brain:
  primary_llm: "local" # 'local' or 'cloud'
  local_model: "llama3.1:8b-instruct-q4_K_M" # Recommended for 4GB VRAM
  cloud_model: "claude-3-5-sonnet-20240620"
  anthropic_api_key: "YOUR_ANTHROPIC_KEY"
  
memory:
  db_path: "./memory/chroma_db"
  embedding_model: "all-MiniLM-L6-v2"

apps:
  # Map keywords to executables
  chrome: "C:/Program Files/Google/Chrome/Application/chrome.exe"
  notepad: "notepad.exe"
  spotify: "spotify.exe"
