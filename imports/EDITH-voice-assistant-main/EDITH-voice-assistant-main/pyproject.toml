[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edith-voice-assistant"
version = "0.1.0"
description = "EDITH: A Python-based virtual voice assistant (multi-module)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Ranjith Guggilla"}]
keywords = ["voice-assistant", "speech-recognition", "tts", "python", "AI"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
