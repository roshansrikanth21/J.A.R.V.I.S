name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff black mypy
      - name: Lint
        run: ruff .
      - name: Format check
        run: black --check .
      - name: Type check
        run: mypy src || true
      - name: Tests
        run: pytest -q
